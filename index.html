<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách 40 Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 2rem;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .video-card {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .video-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .thumbnail {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      background: #333;
    }
    .info {
      padding: 14px;
    }
    .title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .meta {
      font-size: 0.85rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Danh sách 40 Video</h1>
  <div class="video-grid" id="videoGrid"></div>

  <script>
    // Dữ liệu 40 video mẫu
    const videos = Array.from({ length: 40 }, (_, i) => {
      const id = i + 1;
      return {
        id,
        title: `Video số ${id} - Hướng dẫn / Giải trí / Demo`,
        description: `Đây là mô tả chi tiết của video số ${id}. Nội dung hấp dẫn, dễ hiểu và hữu ích.`,
        thumbnail: `https://picsum.photos/seed/video${id}/640/360`,
        // Dùng video mẫu công khai (có thể thay bằng YouTube embed hoặc file mp4 thật)
        videoUrl: `https://www.w3schools.com/html/mov_bbb.mp4`,
        views: Math.floor(Math.random() * 500000) + 1000,
        duration: `${Math.floor(Math.random() * 20) + 3}:${String(Math.floor(Math.random() * 60)).padStart(2, '0')}`
      };
    });

    // Lưu dữ liệu vào localStorage để trang detail lấy được
    localStorage.setItem('videos', JSON.stringify(videos));

    // Render danh sách
    const grid = document.getElementById('videoGrid');
    videos.forEach(video => {
      const card = document.createElement('a');
      card.href = `detail.html?id=${video.id}`;
      card.className = 'video-card';
      card.innerHTML = `
        <img class="thumbnail" src="${video.thumbnail}" alt="${video.title}" loading="lazy">
        <div class="info">
          <div class="title">${video.title}</div>
          <div class="meta">${video.views.toLocaleString()} lượt xem • ${video.duration}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
