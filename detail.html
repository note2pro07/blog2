<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết Ảnh</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      padding: 24px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .back {
      display: inline-block;
      margin-bottom: 24px;
      color: #3ea6ff;
      text-decoration: none;
      font-size: 1rem;
    }
    .back:hover { text-decoration: underline; }
    .image-wrapper {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 24px;
      background: #1a1a1a;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      max-height: 80vh;
      object-fit: contain;
    }
    h1 {
      font-size: 1.7rem;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .meta {
      color: #aaa;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }
    .description {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 12px;
      line-height: 1.7;
      color: #ddd;
      font-size: 1.05rem;
    }
    .error {
      text-align: center;
      padding: 80px 20px;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Quay lại danh sách</a>
    <div id="content"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'));
    const images = JSON.parse(localStorage.getItem('images') || '[]');
    const image = images.find(img => img.id === id);
    const content = document.getElementById('content');

    if (!image) {
      content.innerHTML = `
        <div class="error">
          <h2>Không tìm thấy ảnh</h2>
          <p>Ảnh với ID ${id || '?'} không tồn tại.</p>
          <a href="index.html" style="color:#3ea6ff">Quay lại danh sách</a>
        </div>
      `;
    } else {
      document.title = image.title + " | Chi tiết";
      content.innerHTML = `
        <div class="image-wrapper">
          <img src="${image.fullUrl}" alt="${image.title}" loading="eager">
        </div>
        <h1>${image.title}</h1>
        <div class="meta">
          Danh mục: ${image.category} • Kích thước: ${image.size}
        </div>
        <div class="description">${image.description}</div>
      `;
    }
  </script>
</body>
</html>
