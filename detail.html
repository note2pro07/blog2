<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chi tiết Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f;
      color: #fff;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #3ea6ff;
      text-decoration: none;
      font-size: 1rem;
    }
    .back:hover { text-decoration: underline; }
    .player-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 10px;
    }
    .meta {
      color: #aaa;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    .description {
      line-height: 1.6;
      color: #ddd;
      white-space: pre-wrap;
    }
    .error {
      text-align: center;
      padding: 60px 20px;
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back">← Quay lại danh sách</a>

    <div id="content">
      <!-- Nội dung sẽ được render bằng JS -->
    </div>
  </div>

  <script>
    // Lấy id từ URL
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get('id'));

    // Lấy dữ liệu từ localStorage
    const videos = JSON.parse(localStorage.getItem('videos') || '[]');
    const video = videos.find(v => v.id === id);

    const content = document.getElementById('content');

    if (!video) {
      content.innerHTML = `
        <div class="error">
          <h2>Không tìm thấy video</h2>
          <p>Video với ID ${id} không tồn tại.</p>
          <a href="index.html" style="color:#3ea6ff">Quay lại danh sách</a>
        </div>
      `;
    } else {
      document.title = video.title;
      content.innerHTML = `
        <div class="player-wrapper">
          <video controls autoplay muted>
            <source src="${video.videoUrl}" type="video/mp4">
            Trình duyệt của bạn không hỗ trợ video.
          </video>
        </div>
        <h1>${video.title}</h1>
        <div class="meta">
          ${video.views.toLocaleString()} lượt xem • Thời lượng: ${video.duration}
        </div>
        <div class="description">${video.description}</div>
      `;
    }
  </script>
</body>
</html>
